[project]
name = "earth-jukebox"
version = "0.1.0"
description = "NASA Space Apps 2026: The Earth Information Jukebox Data & DSP Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "xarray>=2024.9.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
